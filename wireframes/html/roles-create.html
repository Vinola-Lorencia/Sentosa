<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Create Role — Sentosa Wireframe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wf-shell">
    
    <aside class="wf-sidebar">
      <div class="logo">TOKO SENTOSA<br><span style="font-weight:400;font-size:11px;">Sistem Inventaris</span></div>
      
      <div class="section-title">Manajemen Stok</div>
      
      <div class="menu-item">Produk</div>
  
      <div class="section-title">Master Data</div>
      
      <div class="menu-item">Suppliers</div>
      <div class="menu-item">Pelanggan</div>
  
      <div class="section-title">Pembelian</div>
      
      <div class="menu-item">Purchase Orders</div>
      <div class="menu-item">Pembelian</div>
  
      <div class="section-title">Penjualan</div>
      
      <div class="menu-item">Penjualan<span class="menu-badge">3</span></div>
      <div class="menu-item">Pengiriman</div>
  
      <div class="section-title">Keuangan</div>
      
      <div class="menu-item">Piutang</div>
  
      <div class="section-title">Laporan</div>
      
      <div class="menu-item">Lap. Penjualan</div>
      <div class="menu-item">Lap. Pembelian</div>
      <div class="menu-item">Lap. Piutang</div>
  
      <div class="section-title">Settings</div>
      
      <div class="menu-item">Users</div>
      <div class="menu-item active">Role</div>
  
      <div class="user-box">
        <div style="font-weight:600;color:#333;">Nama User</div>
        <div>user@sentosa.com</div>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <span class="wf-badge">Profile</span>
          <span class="wf-badge">Keluar</span>
        </div>
      </div>
    </aside>
    <div class="wf-main">
      <div class="wf-topbar">
        <h1>Create Role</h1>
        <div class="actions"><button class="wf-btn">Back</button></div>
      </div>
      <div class="wf-content">
        <div class="wf-panel"><div style="display:flex;flex-direction:column;gap:16px;max-width:520px;">
        <div class="wf-form-row"><label>Role Name</label><div class="wf-input"></div></div>
      </div></div>
<div style="display:flex;gap:12px;justify-content:flex-end;"><button class="wf-btn">Cancel</button><button class="wf-btn primary">Save Role</button></div>
      </div>
    </div>
  </div>
</body>
</html>
