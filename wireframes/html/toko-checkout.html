<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Checkout — Sentosa Wireframe</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="store">
  <div class="wf-store-nav">
    <div class="logo-sm">TOKO SENTOSA</div>
    <div class="actions"><span class="hint">&larr; Kembali ke Keranjang</span>&nbsp;&nbsp;Nama User</div>
  </div>
  <div class="wf-store-content">
    <div class="wf-two-col" style=""><div style="display:flex;flex-direction:column;gap:16px;"><div class="wf-panel"><div style="font-weight:600;margin-bottom:14px;">Info Pengiriman</div><div style="display:flex;flex-direction:column;gap:16px;max-width:100%;">
        <div class="wf-form-row"><label>Nama Pemesan</label><div class="wf-input"></div></div><div class="wf-form-row"><label>Alamat Pengiriman</label><div class="wf-textarea" style="height:70px;"></div><div class="hint">Isi jika ingin dikirim, kosongkan jika ambil sendiri</div></div><div class="wf-form-row"><label>Metode Pembayaran</label><div class="wf-select">Cash / Transfer / Utang <span class="arrow">&#9662;</span></div></div><div class="wf-form-row"><label>Catatan</label><div class="wf-textarea" style="height:70px;"></div></div>
      </div></div><div style="display:flex;gap:12px;justify-content:flex-end;"><button class="wf-btn primary">Kirim Pesanan</button></div></div><div style="display:flex;flex-direction:column;gap:16px;"><div class="wf-panel"><div style="font-weight:600;margin-bottom:14px;">Ringkasan Pesanan</div><div class="wf-panel" style="padding:0;overflow:hidden;">
        
        <table class="wf-table">
          <thead><tr><th>Produk</th><th>Qty x Harga</th></tr></thead>
          <tbody>
            <tr><td><span class="bar" style="width:35%"></span></td><td><span class="bar" style="width:55%"></span></td></tr><tr><td><span class="bar" style="width:65%"></span></td><td><span class="bar" style="width:65%"></span></td></tr><tr><td><span class="bar" style="width:65%"></span></td><td><span class="bar" style="width:40%"></span></td></tr>
          </tbody>
        </table>
        
        
      </div><div style="display:flex;justify-content:space-between;font-weight:700;margin-top:12px;border-top:2px solid var(--border-strong);padding-top:12px;"><span>Total</span><span>Rp xxx.xxx</span></div></div></div></div>
  </div>
</body>
</html>
